# omacosy — automatic fullscreen. Read once at startup by omacosy-bar.
#
# AeroSpace only. OmniWM handles its own layout.

# solo = on | off
#
# on: a workspace holding exactly one tiled window gives that window the
# whole display with no gaps. A second window appears and both tile again.
# Close back to one and it goes full again.
#
# Off by default because what it is worth depends on your gaps. With outer
# gaps of 8 it buys 8 px a side, which is cosmetic. Someone running larger
# gaps deliberately wants them.
#
# Super+F is untouched. The rule only acts when a workspace's window count
# changes, and pressing Super+F changes no count, so a manual choice is
# never undone. The workspace returns to automatic at the next open or
# close.
#
# Floating windows and the windows of hidden apps do not count, so a
# workspace showing one window behaves as one window.
solo=off
