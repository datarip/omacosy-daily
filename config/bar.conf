# omacosy-bar — who owns the menu-bar strip. Read once at startup.
#
# macos-defaults.sh auto-hides the native menu bar so this bar can have
# the strip. Auto-hide is not permanent hide: the native bar comes back
# whenever the pointer reaches the top edge, into the same strip, and
# apps that live only in the status area are unreachable while this bar
# is in front of it. The top edge is therefore split. The left half
# belongs to this bar, the right half is left to the native one.

# autohide = auto | on | off
#
# auto reads the display. A notched display keeps the bar visible: macOS
# already excludes the camera strip from the usable area, so hiding the
# bar there gives back no screen. A flat panel or an external monitor
# hides it at rest and gets that height back for windows.
autohide=auto

# split = 0.0 .. 1.0 — where the top edge divides, as a fraction of the
# display width. 0.5 is a starting point rather than a measured one; the
# right value depends on how far left your status items reach.
split=0.5
