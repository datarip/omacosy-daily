# App choices for keybindings. Override in config/apps.local.conf
# (gitignored) — same KEY=Value lines — then re-run install.sh.
TERMINAL=Ghostty
# Super+Space: auto, raycast, tinycast, alfred, omniwm or none.
# auto = Raycast under AeroSpace, OmniWM's launcher under OmniWM.
LAUNCHER=auto
# on keeps each launcher's own Option+Space shortcut. off swallows it in
# Karabiner, so Super+Space is the only way in. Ignored when the chosen
# launcher has no own hotkey (OmniWM), and for LAUNCHER=none.
LAUNCHER_OWN_HOTKEY=on
# BROWSER and EMAIL are unset on purpose: those chords follow the macOS
# default web browser and mail app. Set either to an app name here or in
# settings.conf to pin it.
MUSIC=Spotify
MESSENGER=Slack
