# omacosy-settings reads ~/.config/omacosy/settings.conf. install.sh
# copies this file there once and never overwrites it after that. Edit
# the copy, then run omacosy-settings. See docs/customising.md.
#
# bash reads this file with `source`: KEY=value, no spaces around "=",
# and quotes around a value that holds spaces or newlines.

# Which apps the launch chords open. Empty keeps the upstream default.
TERMINAL=Ghostty
BROWSER=Safari
MUSIC=Spotify
MESSENGER=Slack

# Send an app to a workspace on sight: "<bundle id> <workspace>".
# Find a bundle id with:  osascript -e 'id of app "Safari"'
APP_WORKSPACE_RULES="
com.apple.Safari        1
com.apple.mail          2
com.apple.Terminal      3
"

# Windows that must float instead of tile. A bundle id, or
# title:<substring> to match the window title. OmniWM reads this list.
# AeroSpace takes its float rules from its own template.
APP_FLOAT_RULES="
org.pqrs.Karabiner-Elements.Settings
com.apple.systempreferences
"

# Focus ring radius, used while WINDOW_CORNER is empty. The ring colour
# comes from the theme. "" leaves the radius alone.
RING_RADIUS="17.5"

# Radius macOS draws window corners with. "" leaves it alone. When it is
# set, the ring follows it: radius = corner + gap + width/2, with gap and
# width from ~/.config/omacosy/borders.conf.
WINDOW_CORNER=""

# 1 routes the music and messenger chords through omacosy-spawn-cmd, so
# a burst of presses opens one window at a time. 0 leaves them alone.
SERIALIZE_APP_SPAWNS="1"
